<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زیرەک | یاریدەدەری زیرەکی دەستکرد</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e1a;
    --card: #131a2a;
    --border: rgba(99,102,241,0.15);
    --text: #e6edf3;
    --muted: #8b949e;
    --primary: #6366f1;
    --primary-2: #a855f7;
    --accent: #22d3ee;
    --user-bubble: linear-gradient(135deg, #6366f1, #a855f7);
  }
  html, body {
    font-family: 'Noto Kufi Arabic', sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(99,102,241,0.15), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(168,85,247,0.15), transparent 40%);
  }

  /* ==== لایوت ==== */
  .app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 900px; margin: 0 auto;
    padding: 16px;
  }

  /* ==== هێدەر ==== */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-radius: 16px;
    background: rgba(19,26,42,0.7); backdrop-filter: blur(20px);
    border: 1px solid var(--border); margin-bottom: 12px;
    flex-shrink: 0;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 900; font-size: 1.2rem;
  }
  .logo-icon {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 4px 20px rgba(99,102,241,0.4);
  }
  .logo-text {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .logo-status { font-size: 0.7rem; color: #22c55e; font-weight: 600; }
  .logo-status::before { content: '● '; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .header-btns { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; font-family: inherit;
  }
  .icon-btn:hover { background: rgba(99,102,241,0.15); border-color: var(--primary); }

  /* ==== چاتی نامەکان ==== */
  .chat {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column;
    gap: 16px; padding: 8px 4px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }

  .msg {
    display: flex; gap: 10px;
    animation: fadeIn 0.3s ease;
    max-width: 85%;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-start; flex-direction: row-reverse; }
  .msg.ai { align-self: flex-end; }

  .avatar {
    width: 36px; height: 36px; border-radius: 10px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }
  .msg.user .avatar {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
  }
  .msg.ai .avatar {
    background: linear-gradient(135deg, var(--accent), #3b82f6);
  }

  .bubble {
    padding: 12px 16px; border-radius: 16px;
    line-height: 1.8; font-size: 0.95rem;
    white-space: pre-wrap; word-wrap: break-word;
    overflow-wrap: break-word; min-width: 60px;
  }
  .msg.user .bubble {
    background: var(--user-bubble); color: white;
    border-top-right-radius: 4px;
  }
  .msg.ai .bubble {
    background: var(--card); border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  /* ==== نووسینی دەستپێک ==== */
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 20px; padding: 20px;
  }
  .welcome-icon {
    font-size: 4rem; animation: bounce 2s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .welcome h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .welcome p { color: var(--muted); max-width: 500px; font-size: 0.95rem; }

  .suggestions {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px; width: 100%; max-width: 600px; margin-top: 10px;
  }
  .suggestion {
    background: var(--card); border: 1px solid var(--border);
    padding: 14px 16px; border-radius: 12px;
    cursor: pointer; text-align: right; font-family: inherit;
    color: var(--text); font-size: 0.85rem; transition: all 0.2s;
  }
  .suggestion:hover {
    border-color: var(--primary); transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(99,102,241,0.2);
  }
  .suggestion strong { display: block; color: var(--accent); margin-bottom: 4px; font-size: 0.8rem; }

  /* ==== بەشی نووسین ==== */
  .composer {
    flex-shrink: 0; margin-top: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 8px;
    display: flex; gap: 8px; align-items: flex-end;
    transition: border-color 0.2s;
  }
  .composer:focus-within { border-color: var(--primary); }

  .composer textarea {
    flex: 1; background: transparent; border: none;
    color: var(--text); font-family: inherit; font-size: 0.95rem;
    padding: 10px 12px; resize: none; outline: none;
    max-height: 150px; line-height: 1.6;
  }
  .composer textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border: none; color: white; cursor: pointer; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 4px 20px rgba(99,102,241,0.5); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ==== نووسینی بیرکردنەوە ==== */
  .typing .bubble { display: flex; gap: 4px; padding: 16px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: typing 1.4s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  /* ==== ئاگاداری ==== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #ef4444; color: white; padding: 12px 24px;
    border-radius: 12px; font-size: 0.9rem; z-index: 1000;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    box-shadow: 0 8px 30px rgba(239,68,68,0.4);
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .app { padding: 8px; }
    .msg { max-width: 92%; }
    .bubble { font-size: 0.9rem; padding: 10px 14px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div>
        <div class="logo-text">زیرەک</div>
        <div class="logo-status">ئامادەیە</div>
      </div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" onclick="clearChat()" title="سڕینەوەی چات">🗑️</button>
    </div>
  </header>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🤖</div>
      <h1>سڵاو! من زیرەکم</h1>
      <p>
        یاریدەدەرێکی زیرەکی دەستکردم کە بە کوردی قسە دەکەم.
        هەر پرسیارێکت هەیە بێ پرسیار بیکە — من ئامادەیم یارمەتیت بدەم.
      </p>
      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion('ژیانی پێغەمبەر محەممەد بۆم باس بکە بە کورتی')">
          <strong>📖 زانست</strong>
          ژیانی پێغەمبەر بۆم باس بکە
        </button>
        <button class="suggestion" onclick="sendSuggestion('چۆن دەتوانم کوردی باشتر فێر ببم؟')">
          <strong>📚 فێرکردن</strong>
          چۆن کوردی باشتر فێر ببم؟
        </button>
        <button class="suggestion" onclick="sendSuggestion('وێبسایتێکی سادە بە HTML بۆم دروست بکە')">
          <strong>💻 کۆدنووسی</strong>
          وێبسایتێک بە HTML بۆم دروست بکە
        </button>
        <button class="suggestion" onclick="sendSuggestion('چیرۆکێکی کورت بۆ منی بگێڕەوە')">
          <strong>✨ چیرۆک</strong>
          چیرۆکێکی کورت بۆم بگێڕەوە
        </button>
      </div>
    </div>
  </div>

  <div class="composer">
    <textarea
      id="input"
      placeholder="نامەیەک بنووسە بە کوردی..."
      rows="1"
      oninput="autoResize(this)"
      onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');
const toast = document.getElementById('toast');

let messages = [];
let isTyping = false;

// سیستەم پرۆمپت بۆ کوردی
const SYSTEM_PROMPT = `تۆ یاریدەدەرێکی زیرەکی دەستکردیت بە ناوی "زیرەک" کە بە زمانی کوردی (سۆرانی) وەڵام دەدەیتەوە. 
هەمیشە بە کوردییەکی ڕوون و سادە و ڕاستەقینە بدوێ. 
ئەگەر پرسیارەکە بە کوردی بوو، بە کوردی وەڵام بدەوە.
وەڵامەکانت کورت و بەسوود بن، بەڵام تەواو و تێروتەسەل بن.
ئەگەر پرسیارێک نازانیت، بە ڕاستگۆیی بڵێ نازانیت.`;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendSuggestion(text) {
  input.value = text;
  sendMessage();
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function addMessage(role, text) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  const icon = role === 'user' ? '👤' : '🤖';
  msg.innerHTML = `
    <div class="avatar">${icon}</div>
    <div class="bubble"></div>
  `;
  const bubble = msg.querySelector('.bubble');
  bubble.textContent = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function addTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg ai typing';
  msg.id = 'typingMsg';
  msg.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isTyping) return;

  if (welcome) {
    welcome.style.display = 'none';
  }

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  isTyping = true;
  addTyping();

  try {
    const reply = await getAIResponse(text);
    removeTyping();
    addMessage('ai', reply);
    messages.push({ role: 'assistant', content: reply });
  } catch (error) {
    removeTyping();
    addMessage('ai', '😔 ببوورە، کێشەیەک ڕوویدا لە پەیوەندیکردن. تکایە دووبارە هەوڵ بدەوە.');
    console.error(error);
  } finally {
    isTyping = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// پەیوەندی بە API ی خۆڕایی (Pollinations AI)
async function getAIResponse(userMessage) {
  // دروستکردنی پرۆمپت بە مێژووی چات
  let conversationHistory = '';
  const recentMessages = messages.slice(-6); // دوایین ٦ نامە
  recentMessages.forEach(m => {
    conversationHistory += `${m.role === 'user' ? 'بەکارهێنەر' : 'زیرەک'}: ${m.content}\n`;
  });

  const fullPrompt = `${SYSTEM_PROMPT}\n\nمێژووی گفتوگۆ:\n${conversationHistory}\nزیرەک:`;

  const encodedPrompt = encodeURIComponent(fullPrompt);

  // API ی Pollinations - خۆڕایی، بێ کلیلی API
  const response = await fetch(
    `https://text.pollinations.ai/${encodedPrompt}?model=openai&seed=${Math.floor(Math.random() * 1000000)}`,
    { method: 'GET' }
  );

  if (!response.ok) {
    throw new Error('API response not ok: ' + response.status);
  }

  const text = await response.text();
  const cleaned = text.trim();

  if (!cleaned) {
    throw new Error('Empty response');
  }

  return cleaned;
}

function clearChat() {
  if (messages.length === 0) return;
  if (!confirm('دڵنیایت لە سڕینەوەی هەموو چاتەکە؟')) return;
  
  messages = [];
  chat.innerHTML = '';
  if (welcome) {
    chat.appendChild(welcome);
    welcome.style.display = 'flex';
  }
}

// فوکەس لە سەرەتا
input.focus();
</script>
</body>
  </html>
